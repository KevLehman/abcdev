[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PUBLIC_GOATCOUNTER = "https://abcdev.goatcounter.com/count"

# Astro asset filenames are content-hashed, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Host-scoped rules cannot redirect the primary domain back to itself.
[[redirects]]
  from = "https://kaleman.netlify.app/*"
  to = "https://kevinaleman.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://kaleman.netlify.app/*"
  to = "https://kevinaleman.com/:splat"
  status = 301
  force = true

# Serve static article exports as Markdown, without an HTML wrapper.
[[headers]]
  for = "/markdown/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
