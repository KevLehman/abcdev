<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="title desc">
  <title id="title">The kernel only failed with both files built by the new compiler</title>
  <desc id="desc">Using the new compiler for file A and GCC for file B boots, as does reversing them. Using the new compiler for both files fails.</desc>
  <rect width="840" height="420" rx="12" fill="#f2ede2"/>
  <g font-family="system-ui, sans-serif" fill="#223943">
    <text x="42" y="58" font-size="34" font-weight="700">One pair, three kernel builds</text>
    <g font-size="22" font-weight="600" letter-spacing="1"><text x="57" y="119">FILE A</text><text x="314" y="119">FILE B</text><text x="608" y="119">RESULT</text></g>
    <path d="M42 134H798 M42 216H798 M42 298H798 M42 380H798" fill="none" stroke="#b7b8ab" stroke-width="2"/>
    <g fill="#cadae0"><rect x="42" y="148" width="207" height="53" rx="8"/><rect x="299" y="230" width="207" height="53" rx="8"/><rect x="42" y="312" width="207" height="53" rx="8"/><rect x="299" y="312" width="207" height="53" rx="8"/></g>
    <g font-size="28"><text x="57" y="185">New compiler</text><text x="314" y="185">GCC</text><text x="57" y="267">GCC</text><text x="314" y="267">New compiler</text><text x="57" y="349">New compiler</text><text x="314" y="349">New compiler</text></g>
    <g fill="none" stroke="#52736b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="m610 174 8 8 17-20m-25 94 8 8 17-20"/></g>
    <path d="m612 328 20 20m0-20-20 20" stroke="#984c37" stroke-width="4" stroke-linecap="round"/>
    <g font-size="30" font-weight="700"><text x="651" y="185">Boots</text><text x="651" y="267">Boots</text><text x="651" y="349" fill="#863e2c">Fails</text></g>
  </g>
</svg>
