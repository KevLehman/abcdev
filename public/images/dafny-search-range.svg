<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-labelledby="title desc"><title id="title">Binary search range</title><desc id="desc">For key 5 in 1, 3, 5, 7, 9: low is 2 and high is 3. The remaining range contains only 5. Values outside it are too small or too large.</desc><rect width="800" height="280" rx="12" fill="#f1f4f8"/><g font-family="system-ui, sans-serif" fill="#202b3b"><text x="38" y="45" font-size="23" font-weight="700">Searching for 5</text><text x="38" y="78" font-size="17">The remaining range includes low, but excludes high.</text><rect x="130" y="112" width="86" height="64" rx="6" fill="#dbe2ea"/><text x="173" y="155" font-size="28" text-anchor="middle" fill="#202b3b">1</text><rect x="238" y="112" width="86" height="64" rx="6" fill="#dbe2ea"/><text x="281" y="155" font-size="28" text-anchor="middle" fill="#202b3b">3</text><rect x="346" y="112" width="86" height="64" rx="6" fill="#b5c9ff"/><text x="389" y="155" font-size="28" text-anchor="middle" fill="#202b3b">5</text><rect x="454" y="112" width="86" height="64" rx="6" fill="#dbe2ea"/><text x="497" y="155" font-size="28" text-anchor="middle" fill="#202b3b">7</text><rect x="562" y="112" width="86" height="64" rx="6" fill="#dbe2ea"/><text x="605" y="155" font-size="28" text-anchor="middle" fill="#202b3b">9</text><text x="281" y="205" font-size="16" text-anchor="middle">too small</text><text x="389" y="205" font-size="16" text-anchor="middle" font-weight="700">low = 2</text><text x="497" y="205" font-size="16" text-anchor="middle" font-weight="700">high = 3</text><text x="551" y="234" font-size="16" text-anchor="middle">too large</text><text x="38" y="263" font-size="15">Positions 0 and 1 are below low; positions 3 and 4 are at or above high.</text></g></svg>