<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-labelledby="title desc"><title id="title">A search that does not progress</title><desc id="desc">Searching for 6 with low 2, mid 2 and high 3 leaves only 5. Setting low to mid leaves the same bounds and repeats forever.</desc><rect width="800" height="280" rx="12" fill="#f1f4f8"/><g font-family="system-ui, sans-serif" fill="#202b3b"><text x="38" y="44" font-size="23" font-weight="700">Searching for 6: one element remains</text><text x="38" y="74" font-size="17">The remaining element is 5. It is smaller than 6.</text><rect x="42" y="96" width="337" height="110" rx="8" fill="#ffffff"/><rect x="421" y="96" width="337" height="110" rx="8" fill="#ffffff"/><text x="210" y="123" text-anchor="middle" font-size="17" font-weight="700">Before</text><text x="589" y="123" text-anchor="middle" font-size="17" font-weight="700">After low := mid</text><text x="210" y="154" text-anchor="middle" font-size="20">low = 2     mid = 2     high = 3</text><text x="589" y="154" text-anchor="middle" font-size="20">low = 2     mid = 2     high = 3</text><text x="210" y="182" text-anchor="middle" font-size="17">range: [2, 3) → [5]</text><text x="589" y="182" text-anchor="middle" font-size="17">range: [2, 3) → [5]</text><text x="400" y="163" text-anchor="middle" font-size="25" fill="#375ec9">→</text><text x="38" y="248" font-size="18">Nothing changes. The next iteration checks 5 again.</text></g></svg>